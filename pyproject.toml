[project]
name = "pyfsse"
version = "0.1.0"
description = "TUI save editor for Fallout Shelter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pycryptodomex>=3.23.0"]

[project.scripts]
pyfsse = "pyfsse.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfsse"]
